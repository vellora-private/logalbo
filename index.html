<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Logalbo Crew"><link rel="manifest" href="manifest.webmanifest"><title>Logalbo | Crew</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eff9;background:#0a1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{display:flex;min-height:100vh}.side{width:245px;background:#101b2d;border-right:1px solid #26334a;padding:22px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;margin-bottom:35px}.logo{width:46px;height:46px;object-fit:cover;border-radius:13px;background:#24334b}.nav{display:grid;gap:8px}.nav button{border:0;text-align:left;color:#a8b7cf;background:transparent;border-radius:12px;padding:13px}.nav button.active,.nav button:hover{background:#233653;color:white}.main{flex:1;min-width:0;padding:28px;max-width:1450px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.muted{color:#98a9c3}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#70c7ad;font-weight:800}h1{margin:5px 0;font-size:29px;letter-spacing:-.8px}h2{font-size:19px;margin:0 0 15px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#55d6ae;color:#08231d;font-weight:750}.btn.secondary{background:#24334b;color:#e6efff}.btn.danger{background:#502b37;color:#ffb7c5}.btn.small{padding:7px 11px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:#131f32;border:1px solid #293951;border-radius:18px;padding:19px}.metric{font-size:32px;font-weight:800;margin:12px 0 4px}.panel{margin-bottom:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.dow{text-align:center;font-size:12px;color:#a7b7cc;padding:8px}.day{min-height:115px;background:#0d1829;border:1px solid #27374e;border-radius:11px;padding:8px;overflow:hidden;cursor:pointer}.day.out{opacity:.35}.day.today{border-color:#55d6ae}.daynum{font-size:13px;font-weight:750;margin-bottom:7px}.event{display:block;border:0;text-align:left;width:100%;background:#243f51;color:#d9fff3;border-left:3px solid #55d6ae;border-radius:5px;padding:5px;margin-bottom:5px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.outreach{background:#40384e;color:#eedaff;border-color:#bd9cff}.event.completed{opacity:.55}.jobs{display:grid;gap:10px}.job{background:#0e192b;border:1px solid #2b3b52;border-radius:13px;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-block;background:#2a3c52;border-radius:99px;padding:4px 9px;font-size:11px;color:#c9daec}.pill.green{background:#1d5146;color:#8ef2d1}.pill.purple{background:#40364e;color:#e1c7ff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;color:#b9c9dd;font-weight:650}input,select,textarea{width:100%;background:#0c1626;border:1px solid #34445d;color:#eef5ff;border-radius:10px;padding:11px;outline:none}textarea{min-height:75px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#55d6ae}.modalwrap{position:fixed;inset:0;background:#020712bd;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#152238;border:1px solid #34445d;border-radius:20px;padding:24px;width:min(610px,100%);max-height:92vh;overflow:auto}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#1d3e4c,#0a1220 55%)}.authbox{width:min(410px,100%);background:#142137;border:1px solid #33445e;border-radius:23px;padding:28px}.authbox .brand{margin-bottom:25px}.stack{display:grid;gap:13px}.notice{background:#493622;color:#ffe3aa;border-radius:10px;padding:11px;font-size:13px}.empty{color:#8fa4c0;padding:25px;text-align:center}.mobilebar{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.workerchip{display:inline-block;margin:3px;padding:5px 9px;border-radius:7px;background:#283e53;font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #2b3b52;font-size:13px}th{color:#91a7c2;font-size:11px;text-transform:uppercase}#toast{position:fixed;bottom:24px;right:24px;background:#254c46;color:#d8fff4;padding:12px 18px;border-radius:11px;z-index:30;display:none}@media(max-width:900px){.side{display:none}.main{padding:18px 14px 92px}.cards{grid-template-columns:repeat(2,1fr)}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101b2df2;border-top:1px solid #34445d;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}.mobilebar button{border:0;background:none;color:#a8b9d1;font-size:12px;padding:8px}.mobilebar button.active{color:#55d6ae}.day{min-height:80px;padding:4px}.event{font-size:9px;padding:3px}.daynum{font-size:11px}.formgrid{grid-template-columns:1fr}.job{align-items:flex-start;flex-direction:column}h1{font-size:24px}}@media(max-width:450px){.cards{gap:8px}.card{padding:12px}.metric{font-size:26px}.cal{gap:3px}.day{border-radius:6px}}
</style></head><body><div id="auth" class="auth"><div class="authbox"><div class="brand"><img class="logo" src="logo.jpg" onerror="this.style.display='none'">Logalbo Junk & Hauling</div><div class="eyebrow">Crew portal</div><h1>Welcome back.</h1><p class="muted">Sign in to see your work schedule.</p><div class="stack"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Your username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></div><button class="btn" id="loginBtn">Sign in</button><div id="authMsg" class="tiny muted"></div><div class="notice" id="setupHint">Manager setup: open Settings to connect Supabase after entering your project details in the app configuration.</div></div></div></div>
<div id="shell" class="app hidden"><aside class="side"><div class="brand"><img class="logo" src="logo.jpg" onerror="this.style.display='none'">Logalbo<br>Junk & Hauling</div><nav class="nav" id="sideNav"></nav><div style="position:absolute;bottom:25px" class="muted tiny" id="identity"></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Logalbo crew operations</div><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn secondary small" id="refreshBtn">↻ Sync</button><button class="btn small" id="newBtn">+ New job</button></div></div><div id="content"></div></main><nav class="mobilebar" id="mobileNav"></nav></div><div id="modalWrap" class="modalwrap hidden"><div class="modal"><div class="toolbar"><h2 id="modalTitle">New job</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
// CONFIGURE THESE TWO VALUES. Never put your Supabase service_role key in browser code.
const SUPABASE_URL='https://ndphcbtovmovackzrmii.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_e9225dEgn2-gNOjyBbEq0Q_tB1lDyUS';
const LOGIN_DOMAIN='crew.logalbo.invalid'; // internal alias; users type only username
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let me=null,profile=null,workers=[],jobs=[],clients=[],page='dashboard',month=new Date(),selectedDay=new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const time=t=>t?String(t).slice(0,5):'';const manager=()=>profile?.role==='manager';
const nameFor=id=>workers.find(w=>w.id===id)?.display_name||'Unknown';
const assigned=j=>(j.job_assignments||[]).map(a=>nameFor(a.worker_id));
const emailFor=u=>u.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@'+LOGIN_DOMAIN;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function fail(e){console.error(e);toast(e?.message||'Something went wrong')}
$('loginBtn').onclick=async()=>{if(!db)return $('authMsg').textContent='Supabase is not configured. Edit index.html and follow SETUP.md.';let u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p)return;$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:emailFor(u),password:p});$('loginBtn').disabled=false;if(error)$('authMsg').textContent=error.message;else await boot()};
$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
async function boot(){if(!db)return;const {data:{user}}=await db.auth.getUser();me=user;if(!me){$('auth').classList.remove('hidden');$('shell').classList.add('hidden');return}let {data,error}=await db.from('profiles').select('*').eq('id',me.id).single();if(error||!data){$('authMsg').textContent='Account exists but no crew profile is assigned. Ask the manager.';await db.auth.signOut();return}profile=data;$('auth').classList.add('hidden');$('shell').classList.remove('hidden');$('identity').textContent=profile.display_name+' · '+profile.role;await load();navigate('dashboard')}
async function load(){if(!db||!me)return;const [w,j,c]=await Promise.all([db.from('profiles').select('id,username,display_name,role,active').order('display_name'),db.from('jobs').select('*,job_assignments(worker_id)').order('job_date',{ascending:true}),manager()?db.from('clients').select('*').order('name'):Promise.resolve({data:[]})]);for(let r of [w,j,c])if(r.error)fail(r.error);workers=w.data||[];jobs=j.data||[];clients=c.data||[];render()}
const menu=()=>[{id:'dashboard',label:'⌂ Home'},{id:'calendar',label:'▦ Calendar'},{id:'jobs',label:'▤ Jobs & shifts'},...(manager()?[{id:'clients',label:'♙ Clients'},{id:'team',label:'♧ Team'},{id:'settings',label:'⚙ Settings'}]:[])];
function navigate(p){page=p;render()}
function render(){if(!profile)return;for(let id of ['sideNav','mobileNav'])$(id).innerHTML=menu().map(m=>`<button class="${page===m.id?'active':''}" onclick="navigate('${m.id}')">${m.label}</button>`).join('');$('pageTitle').textContent=({dashboard:'Dashboard',calendar:'Schedule',jobs:'Jobs & shifts',clients:'Clients',team:'Crew members',settings:'Settings'})[page];$('newBtn').style.display=manager()?'':'none';$('content').innerHTML=({dashboard:renderDashboard,calendar:renderCalendar,jobs:renderJobs,clients:renderClients,team:renderTeam,settings:renderSettings})[page]()}
function renderDashboard(){const today=new Date().toISOString().slice(0,10),up=jobs.filter(j=>j.job_date>=today&&j.status!=='cancelled'),mine=jobs.filter(j=>j.job_assignments?.some(a=>a.worker_id===me.id));const visible=manager()?jobs:mine;return `<div class="cards"><div class="card"><div class="muted tiny">Today's schedule</div><div class="metric">${visible.filter(j=>j.job_date===today).length}</div><div class="tiny muted">Assigned events</div></div><div class="card"><div class="muted tiny">Upcoming</div><div class="metric">${visible.filter(j=>j.job_date>=today&&j.status!=='cancelled').length}</div><div class="tiny muted">Jobs and shifts</div></div><div class="card"><div class="muted tiny">Junk removal</div><div class="metric">${visible.filter(j=>j.job_type==='removal'&&j.status!=='cancelled').length}</div><div class="tiny muted">Total scheduled</div></div><div class="card"><div class="muted tiny">Door to door</div><div class="metric">${visible.filter(j=>j.job_type==='outreach'&&j.status!=='cancelled').length}</div><div class="tiny muted">Total scheduled</div></div></div><section class="panel"><div class="toolbar"><h2>Coming up</h2><button class="btn secondary small" onclick="navigate('calendar')">Open calendar</button></div>${jobList(visible.filter(j=>j.job_date>=today&&j.status!=='cancelled').slice(0,8))}</section>`}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,items=jobs.filter(j=>j.job_date===date);cells+=`<div class="day ${d.getMonth()!==m?'out':''} ${date===new Date().toISOString().slice(0,10)?'today':''}" onclick="openDay('${date}')"><div class="daynum">${d.getDate()}</div>${items.slice(0,3).map(j=>`<button class="event ${j.job_type==='outreach'?'outreach':''} ${j.status==='completed'?'completed':''}" onclick="event.stopPropagation();openJob('${j.id}')">${time(j.start_time)} ${esc(j.title)}</button>`).join('')}${items.length>3?`<span class="tiny muted">+${items.length-3}</span>`:''}</div>`}return `<section class="panel"><div class="toolbar"><div class="row"><button class="btn secondary small" onclick="shiftMonth(-1)">‹</button><h2 style="margin:0">${month.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn secondary small" onclick="shiftMonth(1)">›</button></div><button class="btn secondary small" onclick="month=new Date();render()">Today</button></div><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></section><p class="muted tiny">Tap a day to see its jobs and assigned workers.</p>`}
function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function openDay(date){selectedDay=date;const items=jobs.filter(j=>j.job_date===date);openModal(fmt(date),`${jobList(items)}${manager()?`<button class="btn" style="margin-top:16px" onclick="openJob(null,'${date}')">+ Schedule job / shift</button>`:''}`)}
function jobList(items){if(!items.length)return '<div class="empty">No scheduled work here yet.</div>';return `<div class="jobs">${items.map(j=>`<div class="job"><div><div class="row"><b>${esc(j.title)}</b><span class="pill ${j.job_type==='outreach'?'purple':'green'}">${j.job_type==='outreach'?'Door to door':'Junk removal'}</span></div><div class="muted tiny" style="margin-top:7px">${fmt(j.job_date)} · ${time(j.start_time)}${j.end_time?'–'+time(j.end_time):''} · ${esc(j.location||'Location TBD')}</div><div class="tiny muted" style="margin-top:5px">${assigned(j).map(esc).join(', ')||'Unassigned'} · ${esc(j.status)}</div></div><button class="btn secondary small" onclick="openJob('${j.id}')">View</button></div>`).join('')}</div>`}
function renderJobs(){setTimeout(filterJobs,0);return `<section class="panel"><div class="toolbar"><h2>All ${manager()?'scheduled':'assigned'} work</h2><div class="row"><select id="jobFilter" onchange="filterJobs()"><option value="all">All types</option><option value="removal">Junk removal</option><option value="outreach">Door to door</option></select><select id="statusFilter" onchange="filterJobs()"><option value="all">All statuses</option><option value="scheduled">Scheduled</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div></div><div id="filteredJobs"></div></section>`}
function filterJobs(){let t=$('jobFilter')?.value||'all',s=$('statusFilter')?.value||'all',items=jobs.filter(j=>(t==='all'||j.job_type===t)&&(s==='all'||j.status===s));if($('filteredJobs'))$('filteredJobs').innerHTML=jobList(items)}
function renderClients(){if(!manager())return '';return `<section class="panel"><div class="toolbar"><h2>Saved clients</h2><button class="btn" onclick="openClient()">+ Add client</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th><th></th></tr></thead><tbody>${clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td><button class="btn secondary small" onclick="openClient('${c.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>${clients.length?'':'<div class="empty">No clients yet.</div>'}</section>`}
function renderTeam(){if(!manager())return '';return `<section class="panel"><div class="toolbar"><h2>Employees</h2><span class="muted tiny">Create logins securely in Supabase</span></div>${workers.map(w=>`<div class="job"><div><b>${esc(w.display_name)}</b><div class="muted tiny">@${esc(w.username)} · ${esc(w.role)} · ${w.active?'Active':'Inactive'}</div></div><span class="pill">${jobs.filter(j=>j.job_assignments?.some(a=>a.worker_id===w.id)).length} assignments</span></div>`).join('')}</section><section class="panel"><h2>Add a worker</h2><p class="muted">Use the Supabase dashboard to create the authentication account, then add a matching profile. See SETUP.md for LJ and future workers. Never store passwords in this app.</p></section>`}
function renderSettings(){return `<section class="panel"><h2>Connected workspace</h2><p class="muted">Supabase: ${configured?'Configured':'Not configured'}</p><p class="muted">Signed in as ${esc(profile.display_name)} (${esc(profile.role)}).</p><button class="btn danger" onclick="logout()">Sign out</button></section>`}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalWrap').classList.remove('hidden')}
function closeModal(){$('modalWrap').classList.add('hidden')}
$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
function openClient(id){if(!manager())return;let c=clients.find(x=>x.id===id)||{};openModal(id?'Edit client':'Add client',`<form id="clientForm" class="formgrid"><div class="field full"><label>Client name *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email||'')}"></div><div class="field full"><label>Address</label><input name="address" value="${esc(c.address||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><button class="btn" type="submit">Save client</button></form>`);$('clientForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());let r=id?await db.from('clients').update(data).eq('id',id):await db.from('clients').insert(data);if(r.error)return fail(r.error);closeModal();toast('Client saved');await load()}}
function openJob(id,date){let j=jobs.find(x=>x.id===id)||{},edit=!!id;if(!manager()){if(!edit)return;return openModal(j.title,`<p><span class="pill">${j.job_type==='outreach'?'Door to door':'Junk removal'}</span> <span class="pill">${esc(j.status)}</span></p><p><b>${fmt(j.job_date)} · ${time(j.start_time)}–${time(j.end_time)}</b></p><p>${esc(j.location||'No location')}</p><p class="muted">${esc(j.description||'No notes')}</p><p>Assigned: ${assigned(j).map(esc).join(', ')||'None'}</p><div class="actions">${j.status==='scheduled'?`<button class="btn" onclick="updateStatus('${j.id}','in_progress')">Start job</button>`:''}${j.status==='in_progress'?`<button class="btn" onclick="updateStatus('${j.id}','completed')">Mark complete</button>`:''}</div>`)}
let a=new Set((j.job_assignments||[]).map(x=>x.worker_id));openModal(edit?'Edit job / shift':'Schedule work',`<form id="jobForm" class="formgrid"><div class="field full"><label>Job / shift title *</label><input name="title" required value="${esc(j.title||'')}"></div><div class="field"><label>Work type</label><select name="job_type"><option value="removal" ${j.job_type==='removal'?'selected':''}>Junk removal job</option><option value="outreach" ${j.job_type==='outreach'?'selected':''}>Door-to-door shift</option></select></div><div class="field"><label>Status</label><select name="status">${['scheduled','in_progress','completed','cancelled'].map(s=>`<option value="${s}" ${j.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Date *</label><input name="job_date" type="date" required value="${j.job_date||date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Start time *</label><input name="start_time" type="time" required value="${time(j.start_time)||'15:00'}"></div><div class="field"><label>End time</label><input name="end_time" type="time" value="${time(j.end_time)||'18:00'}"></div><div class="field"><label>Quoted price ($)</label><input name="quoted_price" type="number" min="0" step="0.01" value="${j.quoted_price??''}"></div><div class="field full"><label>Client (optional)</label><select name="client_id"><option value="">No client / outreach</option>${clients.map(c=>`<option value="${c.id}" ${j.client_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Job address / neighborhood</label><input name="location" value="${esc(j.location||'')}"></div><div class="field full"><label>Assign workers</label><div>${workers.filter(w=>w.active).map(w=>`<label class="workerchip"><input type="checkbox" name="worker" value="${w.id}" ${a.has(w.id)?'checked':''} style="width:auto"> ${esc(w.display_name)}</label>`).join('')}</div></div><div class="field full"><label>Instructions / job details</label><textarea name="description">${esc(j.description||'')}</textarea></div><div class="actions full"><button class="btn" type="submit">${edit?'Save changes':'Create schedule'}</button>${edit?`<button type="button" class="btn danger" onclick="deleteJob('${id}')">Delete</button>`:''}</div></form>`);$('jobForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={};for(let k of ['title','job_type','status','job_date','start_time','end_time','quoted_price','client_id','location','description'])data[k]=f.get(k)||null;data.quoted_price=data.quoted_price?Number(data.quoted_price):null;let r=edit?await db.from('jobs').update(data).eq('id',id).select().single():await db.from('jobs').insert(data).select().single();if(r.error)return fail(r.error);let jobid=r.data.id,chosen=f.getAll('worker');let del=await db.from('job_assignments').delete().eq('job_id',jobid);if(del.error)return fail(del.error);if(chosen.length){let add=await db.from('job_assignments').insert(chosen.map(worker_id=>({job_id:jobid,worker_id})));if(add.error)return fail(add.error)}closeModal();toast('Schedule saved');await load()}}
async function updateStatus(id,status){let r=await db.from('jobs').update({status}).eq('id',id);if(r.error)return fail(r.error);closeModal();toast('Status updated');await load()}
async function deleteJob(id){if(!confirm('Delete this job permanently?'))return;let r=await db.from('jobs').delete().eq('id',id);if(r.error)return fail(r.error);closeModal();await load()}
async function logout(){await db.auth.signOut();me=null;profile=null;boot()}
$('newBtn').onclick=()=>openJob();$('refreshBtn').onclick=()=>load().then(()=>toast('Schedule synced'));
if(db){db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){me=null;profile=null;$('auth').classList.remove('hidden');$('shell').classList.add('hidden')}});boot();}else{$('authMsg').textContent='Setup required: add your Supabase URL and publishable key to index.html.'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>

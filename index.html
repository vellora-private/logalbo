div><div class="stat-accent blue"></div></div><div class="stat"><div class="stat-num">${up.length}</div><div class="stat-name">Upcoming jobs</div><div class="stat-accent mint"></div></div></div><div class="sectionhead"><div><div class="eyebrow">STAY ON TRACK</div><h3>${next?'Your next assignment':'Upcoming work'}</h3></div><button class="textlink" onclick="navigate('jobs')">See all →</button></div>${next?`<button class="nextjob" onclick="openJob('${next.id}')"><div class="nextbar ${next.job_type==='outreach'?'orange':''}"></div><div class="nextcontent"><div class="nextlabel">${next.job_type==='outreach'?'DOOR-TO-DOOR SHIFT':'JUNK REMOVAL'}</div><strong>${esc(next.title)}</strong><div class="nextmeta">◷ ${fmt(next.job_date)} · ${time(next.start_time)}</div><div class="nextmeta">⌖ ${esc(next.location||'Location not set')}</div><div class="nextfooter"><span>${esc(next.status.replace('_',' '))}</span><span>View details →</span></div></div></button>`:'<div class="empty-state"><div class="empty-emoji">☀</div><strong>You’re all caught up</strong><p>No upcoming assignments right now.</p></div>'}${manager()?'<button class="wide-add" onclick="openJob()">＋ Create a new shift or job</button>':''}`;}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells='',visible=manager()?jobs:jobs.filter(j=>j.job_assignments?.some(a=>a.worker_id===me.id));for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,items=visible.filter(j=>j.job_date===date);cells+=`<button class="calday ${d.getMonth()!==m?'outside':''} ${date===selectedDay?'selected':''}" onclick="selectedDay='${date}';render()"><span>${d.getDate()}</span>${items.length?`<i class="dot ${items.some(j=>j.job_type==='removal')?'blue':''}"></i>`:''}</button>`}let dayItems=visible.filter(j=>j.job_date===selectedDay);return `<div class="page-intro">Tap a date to view your assigned work.</div><section class="calendar-card"><div class="monthbar"><button onclick="shiftMonth(-1)" aria-label="Previous month">‹</button><strong>${month.toLocaleString(undefined,{month:'long',year:'numeric'})}</strong><button onclick="shiftMonth(1)" aria-label="Next month">›</button></div><div class="calgrid">${['S','M','T','W','T','F','S'].map(d=>`<div class="calweek">${d}</div>`).join('')}${cells}</div></section><div class="sectionhead"><div><div class="eyebrow">DAILY SCHEDULE</div><h3>${fmt(selectedDay)}</h3></div>${manager()?`<button class="textlink" onclick="openJob(null,'${selectedDay}')">＋ Add</button>`:''}</div>${jobList(dayItems)}`;}
function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function openDay(date){selectedDay=date;const items=jobs.filter(j=>j.job_date===date);openModal(fmt(date),`${jobList(items)}${manager()?`<button class="btn" style="margin-top:16px" onclick="openJob(null,'${date}')">+ Schedule job / shift</button>`:''}`)}
function jobList(items){if(!items.length)return '<div class="empty-state"><div class="empty-emoji">▦</div><strong>No work scheduled</strong><p>Assignments will show up here.</p></div>';return `<div class="assignment-list">${items.map(j=>`<button class="assignment" onclick="openJob('${j.id}')"><div class="assignment-symbol ${j.job_type==='outreach'?'outreach':''}">${j.job_type==='outreach'?'↗':'▣'}</div><div class="assignment-copy"><div class="assignment-type">${j.job_type==='outreach'?'DOOR TO DOOR':'JUNK REMOVAL'}</div><strong>${esc(j.title)}</strong><small>${fmt(j.job_date)} · ${time(j.start_time)} ${j.end_time?'– '+time(j.end_time):''}</small><small>⌖ ${esc(j.location||'Location TBD')}</small><div class="assignment-people">${assigned(j).map(esc).join(' · ')||'Unassigned'} <span>· ${esc(j.status.replace('_',' '))}</span></div></div><span class="chev">›</span></button>`).join('')}</div>`}
function renderJobs(){setTimeout(filterJobs,0);return `<div class="page-intro">${manager()?'All crew assignments and customer jobs.':'Everything assigned to you.'}</div><div class="filterline"><select id="jobFilter" onchange="filterJobs()"><option value="all">All work types</option><option value="removal">Junk removal</option><option value="outreach">Door to door</option></select><select id="statusFilter" onchange="filterJobs()"><option value="all">Any status</option><option value="scheduled">Scheduled</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="filteredJobs"></div>`}
function filterJobs(){let t=$('jobFilter')?.value||'all',s=$('statusFilter')?.value||'all',items=jobs.filter(j=>(manager()||j.job_assignments?.some(a=>a.worker_id===me.id))&&(t==='all'||j.job_type===t)&&(s==='all'||j.status===s));if($('filteredJobs'))$('filteredJobs').innerHTML=jobList(items)}
function renderClients(){if(!manager())return '';return `<div class="page-intro">Keep customer details in one place.</div><button class="wide-add" onclick="openClient()">＋ Add a customer</button><div class="assignment-list">${clients.map(c=>`<button class="assignment" onclick="openClient('${c.id}')"><div class="assignment-symbol">♙</div><div class="assignment-copy"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'No phone')}</small><small>${esc(c.address||'No address')}</small></div><span class="chev">›</span></button>`).join('')}</div>${clients.length?'':'<div class="empty-state"><strong>No customers yet</strong><p>Save your first customer to get started.</p></div>'}`;}
function renderTeam(){if(!manager())return '';return `<div class="page-intro">Your team, all in one place.</div><div class="sectionhead"><h3>Team members</h3><span class="datechip">${workers.length} people</span></div><div class="assignment-list">${workers.map(w=>`<div class="assignment"><div class="crewavatar">${esc(w.display_name[0])}</div><div class="assignment-copy"><strong>${esc(w.display_name)}</strong><small>@${esc(w.username)} · ${esc(w.role)}</small><small>${jobs.filter(j=>j.job_assignments?.some(a=>a.worker_id===w.id)).length} assigned shifts</small></div><span class="statusdot ${w.active?'on':''}"></span></div>`).join('')}</div><div class="info-panel">To add an employee, create their Supabase Auth account and matching profile. Do not put passwords in website files.</div>`}
function renderSettings(){return `<div class="account-hero"><div class="avatar large">${esc(profile.display_name[0])}</div><h3>${esc(profile.display_name)}</h3><p>@${esc(profile.username)} · ${esc(profile.role)}</p></div><div class="account-list"><div><span>Workspace</span><strong>Logalbo Junk & Hauling</strong></div><div><span>Database connection</span><strong>${configured?'Supabase configured':'Not configured'}</strong></div><div><span>Account status</span><strong>${profile.active?'Active':'Inactive'}</strong></div></div><button class="logout" onclick="logout()">Sign out →</button>`}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalWrap').classList.remove('hidden')}
function closeModal(){$('modalWrap').classList.add('hidden')}
$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
function openClient(id){if(!manager())return;let c=clients.find(x=>x.id===id)||{};openModal(id?'Edit client':'Add client',`<form id="clientForm" class="formgrid"><div class="field full"><label>Client name *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email||'')}"></div><div class="field full"><label>Address</label><input name="address" value="${esc(c.address||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><button class="btn" type="submit">Save client</button></form>`);$('clientForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());let r=id?await db.from('clients').update(data).eq('id',id):await db.from('clients').insert(data);if(r.error)return fail(r.error);closeModal();toast('Client saved');await load()}}
function openJob(id,date){let j=jobs.find(x=>x.id===id)||{},edit=!!id;if(!manager()){if(!edit)return;return openModal(j.title,`<p><span class="pill">${j.job_type==='outreach'?'Door to door':'Junk removal'}</span> <span class="pill">${esc(j.status)}</span></p><p><b>${fmt(j.job_date)} · ${time(j.start_time)}–${time(j.end_time)}</b></p><p>${esc(j.location||'No location')}</p><p class="muted">${esc(j.description||'No notes')}</p><p>Assigned: ${assigned(j).map(esc).join(', ')||'None'}</p><div class="actions">${j.status==='scheduled'?`<button class="btn" onclick="updateStatus('${j.id}','in_progress')">Start job</button>`:''}${j.status==='in_progress'?`<button class="btn" onclick="updateStatus('${j.id}','completed')">Mark complete</button>`:''}</div>`)}
let a=new Set((j.job_assignments||[]).map(x=>x.worker_id));openModal(edit?'Edit job / shift':'Schedule work',`<form id="jobForm" class="formgrid"><div class="field full"><label>Job / shift title *</label><input name="title" required value="${esc(j.title||'')}"></div><div class="field"><label>Work type</label><select name="job_type"><option value="removal" ${j.job_type==='removal'?'selected':''}>Junk removal job</option><option value="outreach" ${j.job_type==='outreach'?'selected':''}>Door-to-door shift</option></select></div><div class="field"><label>Status</label><select name="status">${['scheduled','in_progress','completed','cancelled'].map(s=>`<option value="${s}" ${j.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Date *</label><input name="job_date" type="date" required value="${j.job_date||date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Start time *</label><input name="start_time" type="time" required value="${time(j.start_time)||'15:00'}"></div><div class="field"><label>End time</label><input name="end_time" type="time" value="${time(j.end_time)||'18:00'}"></div><div class="field"><label>Quoted price ($)</label><input name="quoted_price" type="number" min="0" step="0.01" value="${j.quoted_price??''}"></div><div class="field full"><label>Client (optional)</label><select name="client_id"><option value="">No client / outreach</option>${clients.map(c=>`<option value="${c.id}" ${j.client_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Job address / neighborhood</label><input name="location" value="${esc(j.location||'')}"></div><div class="field full"><label>Assign workers</label><div>${workers.filter(w=>w.active).map(w=>`<label class="workerchip"><input type="checkbox" name="worker" value="${w.id}" ${a.has(w.id)?'checked':''} style="width:auto"> ${esc(w.display_name)}</label>`).join('')}</div></div><div class="field full"><label>Instructions / job details</label><textarea name="description">${esc(j.description||'')}</textarea></div><div class="actions full"><button class="btn" type="submit">${edit?'Save changes':'Create schedule'}</button>${edit?`<button type="button" class="btn danger" onclick="deleteJob('${id}')">Delete</button>`:''}</div></form>`);$('jobForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={};for(let k of ['title','job_type','status','job_date','start_time','end_time','quoted_price','client_id','location','description'])data[k]=f.get(k)||null;data.quoted_price=data.quoted_price?Number(data.quoted_price):null;let r=edit?await db.from('jobs').update(data).eq('id',id).select().single():await db.from('jobs').insert(data).select().single();if(r.error)return fail(r.error);let jobid=r.data.id,chosen=f.getAll('worker');let del=await db.from('job_assignments').delete().eq('job_id',jobid);if(del.error)return fail(del.error);if(chosen.length){let add=await db.from('job_assignments').insert(chosen.map(worker_id=>({job_id:jobid,worker_id})));if(add.error)return fail(add.error)}closeModal();toast('Schedule saved');await load()}}
async function updateStatus(id,status){let r=await db.from('jobs').update({status}).eq('id',id);if(r.error)return fail(r.error);closeModal();toast('Status updated');await load()}
async function deleteJob(id){if(!confirm('Delete this job permanently?'))return;let r=await db.from('jobs').delete().eq('id',id);if(r.error)return fail(r.error);closeModal();await load()}
async function logout(){await db.auth.signOut();me=null;profile=null;boot()}
$('newBtn').onclick=()=>openJob();$('refreshBtn').onclick=()=>load().then(()=>toast('Schedule synced'));
if(db){db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){me=null;profile=null;$('auth').classList.remove('hidden');$('shell').classList.add('hidden')}});boot();}else{$('authMsg').textContent='Setup required: add your Supabase URL and publishable key to index.html.'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
